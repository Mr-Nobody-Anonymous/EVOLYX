name: EVOLYX CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Matrix (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout EVOLYX
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[dev]

      - name: Verify Upstream Manifest Integrity
        run: |
          python -c "import json; manifest = json.load(open('upstream/manifest.json')); assert manifest['total_repositories'] == 18, 'Expected 18 repositories in manifest'"

      - name: Run Test Battery (Unit, Integration & Safety)
        run: |
          pytest tests/ -v --durations=10

      - name: Run End-to-End Self-Improvement Pipeline
        run: |
          python scripts/train_pipeline.py --version ci_test_run --epochs 3
