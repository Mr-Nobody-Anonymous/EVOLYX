<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#151b2e"/>
      <stop offset="60%" stop-color="#0a0d17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>

    <!-- Neon Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F355DA"/>
      <stop offset="50%" stop-color="#9B51E0"/>
      <stop offset="100%" stop-color="#5B247A"/>
    </linearGradient>

    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF5E62"/>
    </linearGradient>

    <linearGradient id="helixGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#9B51E0"/>
      <stop offset="100%" stop-color="#F355DA"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="800" height="800" rx="160" fill="url(#bgGrad)"/>
  
  <!-- Subtle Hex Tech Grid Background -->
  <g opacity="0.08" stroke="#00F2FE" stroke-width="1.5" fill="none">
    <polygon points="400,100 480,146 480,238 400,284 320,238 320,146"/>
    <polygon points="560,192 640,238 640,330 560,376 480,330 480,238"/>
    <polygon points="240,192 320,238 320,330 240,376 160,330 160,238"/>
    <polygon points="400,516 480,562 480,654 400,700 320,654 320,562"/>
    <polygon points="560,424 640,470 640,562 560,608 480,562 480,470"/>
    <polygon points="240,424 320,470 320,562 240,608 160,562 160,470"/>
  </g>

  <!-- Outer Orbital Quantum Ring -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="url(#neonViolet)" stroke-width="2" stroke-dasharray="12 18" opacity="0.4"/>
  <circle cx="400" cy="400" r="290" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-dasharray="30 40 10 20" opacity="0.6"/>
  <circle cx="400" cy="400" r="260" fill="none" stroke="url(#neonAmber)" stroke-width="2" stroke-dasharray="8 30" opacity="0.5"/>

  <!-- Orbital Data Nodes -->
  <circle cx="400" cy="80" r="6" fill="#00F2FE" filter="url(#intenseGlow)"/>
  <circle cx="680" cy="280" r="8" fill="#F355DA" filter="url(#intenseGlow)"/>
  <circle cx="620" cy="580" r="6" fill="#FF9900" filter="url(#intenseGlow)"/>
  <circle cx="180" cy="580" r="7" fill="#00F2FE" filter="url(#intenseGlow)"/>
  <circle cx="120" cy="280" r="8" fill="#9B51E0" filter="url(#intenseGlow)"/>

  <!-- Recursive Neural Evolution Spirals / Möbius Ring -->
  <!-- Loop Left / Spiral A -->
  <path d="M 400,200 C 560,140 680,280 620,440 C 560,580 400,600 400,600 C 400,600 240,580 180,440 C 120,280 240,140 400,200 Z"
        fill="none" stroke="url(#helixGrad1)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#coreGlow)" opacity="0.85"/>

  <!-- Loop Overlap / Continuous Gradient Ribbon -->
  <path d="M 280,280 C 350,180 450,180 520,280 C 600,400 480,540 400,560 C 320,540 200,400 280,280 Z"
        fill="none" stroke="url(#neonCyan)" stroke-width="12" stroke-linecap="round"
        filter="url(#intenseGlow)"/>

  <!-- Interconnecting Synaptic Strands (DNA / Neural Rungs) -->
  <g stroke="url(#neonViolet)" stroke-width="3" opacity="0.75">
    <line x1="330" y1="230" x2="470" y2="230" stroke-dasharray="4 4"/>
    <line x1="260" y1="320" x2="540" y2="320" stroke-dasharray="6 6"/>
    <line x1="240" y1="400" x2="560" y2="400" stroke-dasharray="8 4"/>
    <line x1="270" y1="480" x2="530" y2="480" stroke-dasharray="6 6"/>
    <line x1="340" y1="540" x2="460" y2="540" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Recursive Core: Diamond Singularity -->
  <g filter="url(#coreGlow)">
    <polygon points="400,290 480,400 400,510 320,400" fill="url(#neonViolet)" opacity="0.35"/>
    <polygon points="400,310 465,400 400,490 335,400" fill="none" stroke="url(#neonCyan)" stroke-width="4"/>
    <polygon points="400,340 445,400 400,460 355,400" fill="url(#neonAmber)" opacity="0.5"/>
    <!-- Core Nucleus -->
    <circle cx="400" cy="400" r="24" fill="#FFFFFF" filter="url(#intenseGlow)"/>
    <circle cx="400" cy="400" r="12" fill="#00F2FE"/>
  </g>

  <!-- Dynamic Radiation Rays from Nucleus -->
  <g stroke="#FFFFFF" stroke-width="2" opacity="0.6">
    <line x1="400" y1="360" x2="400" y2="330"/>
    <line x1="400" y1="440" x2="400" y2="470"/>
    <line x1="360" y1="400" x2="330" y2="400"/>
    <line x1="440" y1="400" x2="470" y2="400"/>
    <line x1="372" y1="372" x2="350" y2="350"/>
    <line x1="428" y1="428" x2="450" y2="450"/>
    <line x1="428" y1="372" x2="450" y2="350"/>
    <line x1="372" y1="428" x2="350" y2="450"/>
  </g>

  <!-- Evolutionary Vector Arrows (Symbolizing Closed Self-Improvement Loop) -->
  <path d="M 400,140 L 425,180 L 375,180 Z" fill="#00F2FE" filter="url(#intenseGlow)"/>
  <path d="M 640,490 L 610,525 L 600,475 Z" fill="#F355DA" filter="url(#intenseGlow)"/>
  <path d="M 160,490 L 200,475 L 190,525 Z" fill="#4FACFE" filter="url(#intenseGlow)"/>
</svg>
