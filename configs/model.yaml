# Model Configuration
active_backend: "mock" # options: "mock", "transformers", "vllm", "llama_cpp"

backends:
  mock:
    default_response: "EVOLYX mock response"
    latency_ms: 10
    simulated_context_length: 8192

  transformers:
    model_name_or_path: "Qwen/Qwen2.5-0.5B-Instruct"
    device_map: "auto"
    torch_dtype: "bfloat16"
    trust_remote_code: true
    max_context_tokens: 32768

  vllm:
    api_base_url: "http://127.0.0.1:8000/v1"
    model: "Qwen/Qwen2.5-0.5B-Instruct"
    gpu_memory_utilization: 0.85
    max_model_len: 16384

  llama_cpp:
    model_path: "artifacts/models/base/qwen2.5-0.5b-instruct.Q4_K_M.gguf"
    n_ctx: 8192
    n_gpu_layers: -1

sampling:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 2048
  stop: ["<|im_end|>", "### Observation:"]
