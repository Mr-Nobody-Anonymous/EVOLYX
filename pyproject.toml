[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evolyx"
version = "0.1.0"
description = "EVOLYX: Autonomous Self-Improving AI Research Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "EVOLYX Team" }
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
ml = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "accelerate>=0.29.0",
]
all = [
    "evolyx[api,dev,ml]"
]

[project.scripts]
evolyx = "apps.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-p no:asyncio"

[tool.hatch.build.targets.wheel]
packages = ["evolyx", "apps", "integrations"]
