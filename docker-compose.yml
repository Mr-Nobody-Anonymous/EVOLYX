version: '3.8'

services:
  evolyx-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evolyx_api
    ports:
      - "8000:8000"
    environment:
      - EVOLYX_ENV=production
      - EVOLYX_MODEL_BACKEND=${EVOLYX_MODEL_BACKEND:-mock}
      - EVOLYX_API_HOST=0.0.0.0
      - EVOLYX_API_PORT=8000
    volumes:
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs
      - ./experiments:/app/experiments
    restart: unless-stopped

  evolyx-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evolyx_dashboard
    command: ["python", "-m", "apps.dashboard.app"]
    ports:
      - "8501:8501"
    environment:
      - EVOLYX_API_URL=http://evolyx-api:8000
    volumes:
      - ./artifacts:/app/artifacts
      - ./experiments:/app/experiments
    depends_on:
      - evolyx-api
    restart: unless-stopped
